services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-ubuntu-vm
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      NODE_ENV: production
      PORT: "7860"
    volumes:
      - ubuntu_bin:/app/bin
      - ubuntu_rootfs:/app/ubuntu-22-rootfs

volumes:
  ubuntu_bin:
  ubuntu_rootfs: